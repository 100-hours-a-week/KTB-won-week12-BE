# 이 파일은 --spring.profiles.active=local을 지정한 로컬 실행에서만 사용한다.
spring.config.activate.on-profile=local

# Docker의 compose.local.yml로 실행하는 MySQL에만 연결한다.
spring.datasource.url=jdbc:mysql://localhost:3306/kmap_local?characterEncoding=UTF-8&serverTimezone=Asia/Seoul&sslMode=DISABLED&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=kmap
spring.datasource.password=kmap-local-password

# 빈 로컬 DB에는 Flyway V1부터 순서대로 적용하고 Hibernate는 결과만 검증한다.
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.baseline-version=1

# 로컬 서버 실행에 필요한 비밀이 아닌 개발 전용 고정값이다.
jwt.secret=UeGHiMG32HPI/GSXmo6EI4/wEB+QMPf2WnJk/SP7lEY=
jwt.access-token-expiration=30m
jwt.refresh-token-expiration=30d

# S3 Bean 생성용 로컬 기본값이다. 실제 이미지 업로드 검증 시에는 환경변수로 덮어쓴다.
storage.s3.bucket=kmap-local-development
storage.s3.region=ap-northeast-2
storage.s3.upload-url-expiration=5m
storage.s3.download-url-expiration=1h

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
