# 통합 테스트는 외부 DB 없이 매 실행마다 초기화되는 H2 인메모리 DB를 사용한다.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.sql.init.mode=never
spring.h2.console.enabled=false
# 운영 마이그레이션은 MySQL 전용 타입을 사용하므로 H2 기반 통합 테스트에서는 실행하지 않는다.
spring.flyway.enabled=false

# 테스트에서는 AWS에 접속하지 않지만 S3 관련 Bean 생성에 필요한 공개 설정값은 제공한다.
storage.s3.bucket=test-board-image-bucket
storage.s3.region=ap-northeast-2
storage.s3.upload-url-expiration=5m
storage.s3.download-url-expiration=1h

# 실제 운영 비밀키가 아닌 테스트 전용 고정값이다.
jwt.secret=UeGHiMG32HPI/GSXmo6EI4/wEB+QMPf2WnJk/SP7lEY=
jwt.access-token-expiration=30m
jwt.refresh-token-expiration=30d

# CI 로그가 과도하게 커지지 않도록 테스트 SQL 로그를 제한한다.
logging.level.org.hibernate.SQL=INFO
logging.level.org.springframework.jdbc.core=INFO
