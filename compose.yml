services:
  backend:
    image: "${DOCKERHUB_USERNAME:?Set DOCKERHUB_USERNAME in .env}/board-backend:${BACKEND_TAG:-0.1.0}"
    environment:
      # 저사양 EC2에서 JVM이 사용할 힙 메모리 범위를 제한한다.
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx384m"

      # RDS 접속 정보는 EC2의 .env에서 주입하며 MySQL 연결에는 TLS 암호화를 요구한다.
      SPRING_DATASOURCE_URL: "jdbc:mysql://${RDS_ENDPOINT:?Set RDS_ENDPOINT in .env}:${RDS_PORT:-3306}/${RDS_DATABASE:?Set RDS_DATABASE in .env}?characterEncoding=UTF-8&serverTimezone=Asia/Seoul&sslMode=REQUIRED"
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: "com.mysql.cj.jdbc.Driver"
      SPRING_DATASOURCE_USERNAME: "${RDS_USERNAME:?Set RDS_USERNAME in .env}"
      SPRING_DATASOURCE_PASSWORD: "${RDS_PASSWORD:?Set RDS_PASSWORD in .env}"
      # 현재는 Hibernate가 스키마를 생성·갱신하고, 이후 Flyway 도입 시 validate로 전환한다.
      SPRING_JPA_HIBERNATE_DDL_AUTO: "update"
      SPRING_SQL_INIT_MODE: "never"

      # JWT 설정은 이미지에 넣지 않고 EC2의 .env 파일에서 실행 시점에 주입한다.
      JWT_SECRET: "${JWT_SECRET:?Set JWT_SECRET in .env}"
      JWT_ACCESS_TOKEN_EXPIRATION: "${JWT_ACCESS_TOKEN_EXPIRATION:-30m}"
      JWT_REFRESH_TOKEN_EXPIRATION: "${JWT_REFRESH_TOKEN_EXPIRATION:-30d}"

      # 컨테이너 준비 상태 확인에는 상세 정보가 없는 Health 엔드포인트만 노출한다.
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health"
      MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: "never"

      # 운영 컨테이너에서는 개발 중 사용하던 상세 SQL 로그를 출력하지 않는다.
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_JDBC_CORE_JDBCTEMPLATE: "INFO"
      LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_JDBC_CORE_STATEMENTCREATORUTILS: "INFO"
      LOGGING_LEVEL_ORG_HIBERNATE_SQL: "INFO"
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - board-network

  frontend:
    image: "${DOCKERHUB_USERNAME:?Set DOCKERHUB_USERNAME in .env}/board-frontend:${FRONTEND_TAG:-0.1.0}"
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - board-network

networks:
  board-network:
    driver: bridge
