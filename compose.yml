x-backend-common: &backend-common
  environment:
    # 저사양 EC2에서 JVM이 사용할 힙 메모리 범위를 제한한다.
    JAVA_TOOL_OPTIONS: "-Xms128m -Xmx384m"

    # RDS 접속 정보는 EC2의 .env에서 주입하며 MySQL 연결에는 TLS 암호화를 요구한다.
    SPRING_DATASOURCE_URL: "jdbc:mysql://${RDS_ENDPOINT:?Set RDS_ENDPOINT in .env}:${RDS_PORT:-3306}/${RDS_DATABASE:?Set RDS_DATABASE in .env}?characterEncoding=UTF-8&serverTimezone=Asia/Seoul&sslMode=REQUIRED"
    SPRING_DATASOURCE_DRIVER_CLASS_NAME: "com.mysql.cj.jdbc.Driver"
    SPRING_DATASOURCE_USERNAME: "${RDS_USERNAME:?Set RDS_USERNAME in .env}"
    SPRING_DATASOURCE_PASSWORD: "${RDS_PASSWORD:?Set RDS_PASSWORD in .env}"
    # 스키마 변경은 Flyway가 담당하고 Hibernate는 엔티티와 실제 스키마가 일치하는지만 확인한다.
    SPRING_JPA_HIBERNATE_DDL_AUTO: "validate"
    SPRING_SQL_INIT_MODE: "never"
    SPRING_FLYWAY_ENABLED: "true"
    # 기존 Hibernate 스키마를 처음 Flyway에 등록할 때만 true로 실행하고, 등록 후 false로 되돌린다.
    SPRING_FLYWAY_BASELINE_ON_MIGRATE: "${FLYWAY_BASELINE_ON_MIGRATE:-false}"
    SPRING_FLYWAY_BASELINE_VERSION: "1"

    # JWT 설정은 이미지에 넣지 않고 EC2의 .env 파일에서 실행 시점에 주입한다.
    JWT_SECRET: "${JWT_SECRET:?Set JWT_SECRET in .env}"
    JWT_ACCESS_TOKEN_EXPIRATION: "${JWT_ACCESS_TOKEN_EXPIRATION:-30m}"
    JWT_REFRESH_TOKEN_EXPIRATION: "${JWT_REFRESH_TOKEN_EXPIRATION:-30d}"

    # 종료 신호를 받으면 처리 중인 요청을 기다린 뒤 종료한다.
    SERVER_SHUTDOWN: "graceful"
    SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE: "30s"

    # 컨테이너 준비 상태 확인에는 상세 정보가 없는 Health 엔드포인트만 노출한다.
    MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health"
    MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: "never"

    # 운영 컨테이너에서는 개발 중 사용하던 상세 SQL 로그를 출력하지 않는다.
    LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_JDBC_CORE_JDBCTEMPLATE: "INFO"
    LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_JDBC_CORE_STATEMENTCREATORUTILS: "INFO"
    LOGGING_LEVEL_ORG_HIBERNATE_SQL: "INFO"
  expose:
    - "8080"
  healthcheck:
    test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8080/actuator/health"]
    interval: 10s
    timeout: 5s
    retries: 5
    start_period: 30s
  restart: unless-stopped
  stop_grace_period: 40s
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"
  networks:
    - board-network

services:
  backend-a:
    <<: *backend-common
    image: "${DOCKERHUB_USERNAME:?Set DOCKERHUB_USERNAME in .env}/board-backend:${BACKEND_A_TAG:?Set BACKEND_A_TAG in runtime/deployment.env}"
    profiles:
      - a

  backend-b:
    <<: *backend-common
    image: "${DOCKERHUB_USERNAME:?Set DOCKERHUB_USERNAME in .env}/board-backend:${BACKEND_B_TAG:?Set BACKEND_B_TAG in runtime/deployment.env}"
    profiles:
      - b

  frontend:
    image: "${DOCKERHUB_USERNAME:?Set DOCKERHUB_USERNAME in .env}/board-frontend:${FRONTEND_TAG:-0.1.0}"
    # 활성 A/B 슬롯은 배포 스크립트가 이 파일을 변경한 뒤 Nginx를 reload해 전환한다.
    volumes:
      - type: bind
        source: ./runtime/nginx
        target: /etc/nginx/runtime-upstreams
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "${HTTP_PORT:-80}:80"
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - board-network

networks:
  board-network:
    driver: bridge
